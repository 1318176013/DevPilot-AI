version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devpilot-postgres
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot123
      POSTGRES_DB: devpilot_ai
    ports:
      - "5432:5432"
    volumes:
      - devpilot_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpilot -d devpilot_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - devpilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: devpilot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - devpilot_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-lc", "timeout 5 bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  devpilot_pg_data:
  devpilot_redis_data:
  devpilot_qdrant_data:
